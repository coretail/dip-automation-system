<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIP ERFI APP - Daftar Akun</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-gray-900 tracking-tight">Pendaftaran Akun Baru</h2>
            <p class="text-xs text-gray-500 mt-1">Silakan buat username untuk akses tim lab</p>
        </div>

        <form action="/register" method="POST" class="space-y-4">
            <!-- FIELD EMAIL -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </span>
                    <input type="email" name="email" required placeholder="Contoh: user@gmail.com" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>
            </div>

            <!-- FIELD USERNAME -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Contoh: kak.astrid" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>
            </div>

            <!-- FIELD PASSWORD -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Minimal 6 karakter..." 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>
            </div>

            <!-- FIELD CONFIRM PASSWORD -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Konfirmasi Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="confirm_password" required placeholder="Ketik ulang password..." 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2.5 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Ajukan Pendaftaran
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-xs text-gray-500">Sudah punya akun? <a href="/login" class="text-indigo-600 hover:underline font-medium">Login di sini</a></p>
        </div>
    </div>
</body>
</html>
