<div data-lampiran-root data-upload-url="/products/{{ product.id }}/lampiran" data-base-url="/products/{{ product.id }}/lampiran" class="bg-white border border-gray-200 rounded-lg p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3"><select data-lampiran-category aria-label="Kategori lampiran" class="border rounded-md px-3 py-2 text-sm"><option value="">Pilih kategori...</option>{% for category in lampiran_categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select><textarea data-lampiran-note aria-label="Catatan lampiran" maxlength="500" rows="1" placeholder="Catatan opsional (maks. 500 karakter)" class="border rounded-md px-3 py-2 text-sm md:col-span-2"></textarea></div>
    <div data-lampiran-dropzone role="button" tabindex="0" aria-label="Pilih atau tarik file PDF" class="border-2 border-dashed border-indigo-200 rounded-lg p-6 text-center cursor-pointer hover:bg-indigo-50"><i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-400"></i><p class="text-sm font-semibold text-gray-700 mt-2">Tarik PDF ke sini atau klik untuk memilih</p><p class="text-xs text-gray-500">Maksimal 10 file, masing-masing 10 MB</p><input data-lampiran-input class="lampiran-file-input hidden" type="file" accept=".pdf" multiple></div>
    <div data-lampiran-queue class="mt-3"></div>
</div>
