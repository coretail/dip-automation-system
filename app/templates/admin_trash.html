{% extends 'base.html' %}

{% block title %}Sampah - DIP Automation{% endblock %}

{% block content %}
<div class='max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8'>
    <h1 class='text-2xl font-bold text-gray-900 mb-6'>Produk Terhapus (Sampah)</h1>
    
    <div class='bg-white shadow rounded-lg overflow-hidden'>
        <table class='min-w-full divide-y divide-gray-200'>
            <thead class='bg-gray-50'>
                <tr>
                    <th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>Nama Produk</th>
                    <th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>ID</th>
                    <th class='px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider'>Aksi</th>
                </tr>
            </thead>
            <tbody class='bg-white divide-y divide-gray-200'>
                {% for product in products %}
                <tr>
                    <td class='px-6 py-4 whitespace-nowrap'>{{ product.nama_produk }}</td>
                    <td class='px-6 py-4 whitespace-nowrap text-sm text-gray-500'>{{ product.id }}</td>
                    <td class='px-6 py-4 whitespace-nowrap'>
                        <form action='/admin/products/{{ product.id }}/restore' method='POST' onsubmit='return confirm("Yakin ingin mengembalikan produk ini?")'>
                            <button type='submit' class='text-indigo-600 hover:text-indigo-900 font-medium'>Restore</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan='3' class='px-6 py-4 text-center text-sm text-gray-500'>Tidak ada produk di tempat sampah.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
