<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DIP Kosmetik Automation{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-flask-vial text-2xl text-indigo-200"></i>
                    <span class="text-xl font-bold tracking-tight">DIP Builder Fase 1</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition"><i class="fa-solid fa-chart-pie mr-1"></i> Dashboard</a>
                    <a href="/raw-materials" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition"><i class="fa-solid fa-boxes-stacked mr-1"></i> Bahan Baku</a>
                    <a href="/sample-submissions" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-flask mr-1"></i> Pengajuan Sample
                    </a>
                    <a href="/brands" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-copyright mr-1"></i> Kelola Merk
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Block -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
