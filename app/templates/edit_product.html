{% extends 'base.html' %}

{% block title %}Edit Info Produk - {{ product.nama_produk }}{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-lg font-bold text-gray-900">Edit Informasi Produk</h2>
    <p class="text-xs text-gray-500 mb-6">Ubah meta data dokumen formula maklon</p>

    <form method="POST" action="/products/{{ product.id }}/edit">
        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Nama Produk *</label>
            <input type="text" name="nama_produk" value="{{ product.nama_produk or '' }}" required
                   class="w-full border rounded-md px-3 py-2">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Perusahaan *</label>
            <select name="perusahaan" required class="w-full border rounded-md px-3 py-2">
                <option value="">-- Pilih PT --</option>
                <option value="PT Heka" {{ 'selected' if product.perusahaan == 'PT Heka' else '' }}>PT Heka</option>
                <option value="PT Erfi" {{ 'selected' if product.perusahaan == 'PT Erfi' else '' }}>PT Erfi</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Nama Customer / Klien</label>
            <input type="text" name="nama_customer" value="{{ product.nama_customer or '' }}"
                   class="w-full border rounded-md px-3 py-2">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Bentuk Sediaan</label>
                <input type="text" name="sediaan" value="{{ product.sediaan or '' }}"
                       placeholder="Cream / Gel / Serum"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Warna Sediaan</label>
                <input type="text" name="warna" value="{{ product.warna or '' }}"
                       placeholder="Putih / Transparan"
                       class="w-full border rounded-md px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Jenis Kemasan</label>
                <input type="text" name="kemasan" value="{{ product.kemasan or '' }}"
                       placeholder="Botol Pipet / Jar"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Netto / Berat Bersih</label>
                <input type="text" name="netto" value="{{ product.netto or '' }}"
                       placeholder="20 ml / 50 gr"
                       class="w-full border rounded-md px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold mb-1">Nomor NA (Notifikasi BPOM)</label>
                <input type="text" name="no_na_produk" value="{{ product.no_na_produk or '' }}"
                       placeholder="NA18xxxxxxxx"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Status Registrasi NA</label>
                <select name="status_na" class="w-full border rounded-md px-3 py-2">
                    <option value="aktif" {{ 'selected' if product.status_na == 'aktif' else '' }}>Aktif</option>
                    <option value="akan_expired" {{ 'selected' if product.status_na == 'akan_expired' else '' }}>Akan Expired</option>
                    <option value="expired" {{ 'selected' if product.status_na == 'expired' else '' }}>Expired</option>
                    <option value="belum_terdaftar" {{ 'selected' if product.status_na == 'belum_terdaftar' else '' }}>Belum Terdaftar</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                <i class="fa-solid fa-bars-progress mr-1 text-indigo-500"></i> Progres Internal (R&D / BPOM)
            </label>
            <select name="status_progress" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                <option value="R&D / Sample Phase" {% if product.status_progress == 'R&D / Sample Phase' %}selected{% endif %}>
                    🧪 R&D / Sample Phase (Proses Trial Formulasi)
                </option>
                <option value="BPOM Registration" {% if product.status_progress == 'BPOM Registration' %}selected{% endif %}>
                    📋 BPOM Registration (Pengajuan Nomor NA)
                </option>
                <option value="Production Ready" {% if product.status_progress == 'Production Ready' %}selected{% endif %}>
                    🚀 Production Ready (Siap Produksi Massal)
                </option>
                <option value="Discontinued" {% if product.status_progress == 'Discontinued' %}selected{% endif %}>
                    ❌ Discontinued (Tidak Diproduksi Lagi)
                </option>
            </select>
            <p class="text-xs text-gray-400 mt-1">Sesuaikan status ini untuk memantau sejauh mana produk ini diproses di internal lab.</p>
        </div>

        <div class="mb-4">
            <label for="acc_sampel" class="block text-sm font-medium text-gray-700 mb-1">Tanggal ACC Sampel</label>
            <input type="date" id="acc_sampel" name="acc_sampel" 
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Tanggal (Text Design)</label>
                <input type="date" name="tanggal_text_design" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Teks (Deskripsi Marketing)</label>
            <textarea name="teks_marketing" rows="3" placeholder="Deskripsi produk untuk kemasan/label" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none text-sm"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Cara Pakai</label>
            <textarea name="cara_pakai" rows="2" placeholder="Instruksi penggunaan produk" class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none text-sm"></textarea>
        </div>
        <br>

        <div class="flex justify-end gap-2">
            <a href="/products/{{ product.id }}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md">Batal</a>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md">Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
