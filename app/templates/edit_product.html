{% extends 'base.html' %}

{% block title %}Edit Info Produk - {{ product.nama_produk }}{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-lg font-bold text-gray-900">Edit Informasi Produk</h2>
    <p class="text-xs text-gray-500 mb-6">Ubah meta data dokumen formula maklon</p>

    <form method="POST" action="/products/{{ product.id }}/edit">
        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Nama Produk *</label>
            <input type="text" name="nama_produk" value="{{ product.nama_produk or '' }}" required
                   class="w-full border rounded-md px-3 py-2">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Nama Customer / Klien</label>
            <input type="text" name="nama_customer" value="{{ product.nama_customer or '' }}"
                   class="w-full border rounded-md px-3 py-2">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Bentuk Sediaan</label>
                <input type="text" name="sediaan" value="{{ product.sediaan or '' }}"
                       placeholder="Cream / Gel / Serum"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Warna Sediaan</label>
                <input type="text" name="warna" value="{{ product.warna or '' }}"
                       placeholder="Putih / Transparan"
                       class="w-full border rounded-md px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Jenis Kemasan</label>
                <input type="text" name="kemasan" value="{{ product.kemasan or '' }}"
                       placeholder="Botol Pipet / Jar"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Netto / Berat Bersih</label>
                <input type="text" name="netto" value="{{ product.netto or '' }}"
                       placeholder="20 ml / 50 gr"
                       class="w-full border rounded-md px-3 py-2">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold mb-1">Nomor NA (Notifikasi BPOM)</label>
                <input type="text" name="no_na_produk" value="{{ product.no_na_produk or '' }}"
                       placeholder="NA18xxxxxxxx"
                       class="w-full border rounded-md px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Status Registrasi NA</label>
                <select name="status_na" class="w-full border rounded-md px-3 py-2">
                    <option value="aktif" {{ 'selected' if product.status_na == 'aktif' else '' }}>Aktif</option>
                    <option value="akan_expired" {{ 'selected' if product.status_na == 'akan_expired' else '' }}>Akan Expired</option>
                    <option value="expired" {{ 'selected' if product.status_na == 'expired' else '' }}>Expired</option>
                    <option value="belum_terdaftar" {{ 'selected' if product.status_na == 'belum_terdaftar' else '' }}>Belum Terdaftar</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end gap-2">
            <a href="/products/{{ product.id }}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md">Batal</a>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md">Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
