<div id="efekSampingModal" class="fixed inset-0 z-[70] hidden">
    <div class="absolute inset-0 bg-black/40" onclick="closeEfekSampingModal()"></div>
    <div class="relative mx-auto mt-16 w-full max-w-2xl bg-white rounded-lg shadow-xl border border-gray-200 p-5">
        <div class="flex items-start justify-between mb-3">
            <div>
                <h3 class="text-base font-bold text-gray-900">Generate Laporan Monitoring Efek Samping</h3>
                <p class="text-xs text-gray-500 mt-0.5">Periode: <span class="font-semibold text-indigo-700">{{ efek_samping.next_label }}</span></p>
            </div>
            <button type="button" onclick="closeEfekSampingModal()" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form method="post" action="/products/{{ product.id }}/monitoring-efek-samping/generate" class="space-y-4">
            <label class="flex items-center gap-2 text-sm text-gray-800">
                <input type="checkbox" name="ada_kasus" id="efekAdaKasus" value="1" class="rounded border-gray-300 text-indigo-600" onchange="toggleEfekKasusForm(this.checked)">
                Ada kasus efek samping di periode ini
            </label>
            <p class="text-[11px] text-gray-500 -mt-2">Default: tidak ada. Semua kolom di laporan akan berisi "Nihil".</p>

            <div id="efekKasusForm" class="hidden space-y-2">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold text-gray-700">Detail kasus</p>
                    <button type="button" onclick="addEfekKasusRow()" class="text-xs font-semibold text-indigo-600 hover:underline">+ Tambah baris</button>
                </div>
                <div id="efekKasusRows" class="space-y-2"></div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
                <button type="button" onclick="closeEfekSampingModal()" class="px-3 py-2 text-xs font-semibold text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">Batal</button>
                <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 rounded-md hover:bg-indigo-700">Generate PDF</button>
            </div>
        </form>
    </div>
</div>
